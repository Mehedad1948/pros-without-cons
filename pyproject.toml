[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "igdigest"
version = "0.1.0"
description = "Personal Instagram monitoring and digest app (local, single-user)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "apscheduler>=3.11,<4",
    "httpx[socks]>=0.28",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Authenticated local browser connector (also run: python -m playwright install chromium)
browser = ["playwright>=1.50"]
# OCR for images (also needs the Tesseract binary installed on the system)
ocr = ["pytesseract>=0.3.13", "pillow>=10.4"]
# Local transcription of reel audio
transcribe-local = ["faster-whisper>=1.1"]
# LLM / transcription API clients
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
igdigest = "igdigest.cli:main"

[tool.setuptools.packages.find]
include = ["igdigest*"]

[tool.setuptools.package-data]
igdigest = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
